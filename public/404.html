<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Page not found · Riftviewer</title>
<meta name="robots" content="noindex">
<link rel="icon" type="image/png" sizes="32x32" href="/favicon-32.png">
<style>
  body{margin:0;min-height:100vh;display:grid;place-items:center;padding:24px;box-sizing:border-box;text-align:center;color:#e8edf7;font:16px/1.6 system-ui,sans-serif;
    background:radial-gradient(ellipse 70% 60% at 50% 30%,#1b2a48,transparent 70%),#070b14}
  img{width:96px;height:96px;border-radius:22px}
  h1{margin:18px 0 6px;font:900 34px/1.1 Georgia,serif;color:#e6c67f}
  p{margin:0 0 26px;color:#97a3bc}
  a{display:inline-block;margin:4px;padding:12px 22px;border-radius:999px;font-weight:700;text-decoration:none}
  .a1{background:linear-gradient(180deg,#fff4cf,#e6c67f 48%,#9a7633);color:#1d1406}
  .a2{border:1px solid #c8aa6e66;color:#e8edf7}
</style>
</head>
<body>
<main>
  <img src="/icon-192.png" alt="">
  <h1 data-es="Esta página no existe">This page doesn't exist</h1>
  <p data-es="Puede que el enlace esté mal escrito o que la página se haya movido.">The link may be mistyped or the page may have moved.</p>
  <a class="a1" href="/" data-es="Ir al inicio">Go to the home page</a><a class="a2" href="/app/" data-es="Abrir la app">Open the app</a>
</main>
<!-- en inglés por defecto; en español si la persona lo eligió en Riftviewer -->
<script>
try {
  if (localStorage.getItem('rb_lang') === 'es') {
    document.documentElement.lang = 'es';
    document.title = 'Página no encontrada · Riftviewer';
    document.querySelectorAll('[data-es]').forEach(function (e) { e.textContent = e.getAttribute('data-es'); });
  }
} catch (e) {}
</script>
</body>
</html>
